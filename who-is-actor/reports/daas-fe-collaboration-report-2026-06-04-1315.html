  <style>
    :root {
      --bg: #0f1419; --surface: #1a2332; --surface2: #243044;
      --text: #e7ecf3; --muted: #8b9cb3; --accent: #3b82f6; --accent2: #22c55e;
      --warn: #f59e0b; --border: #2d3a4f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      padding: 2rem 1.5rem 4rem;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.75rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 0.5rem; }
    .badge {
      display: inline-block; background: var(--surface2); border: 1px solid var(--border);
      padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.8rem;
      margin: 0.75rem 0.4rem 0 0; color: var(--muted);
    }
    .disclaimer {
      background: linear-gradient(135deg, #1e293b 0%, #172033 100%);
      border: 1px solid var(--border); border-left: 4px solid var(--warn);
      border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 2rem;
      font-size: 0.88rem; color: var(--muted);
    }
    .disclaimer strong { color: var(--warn); }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem; margin-bottom: 2rem;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.1rem 1.2rem;
    }
    .card .label { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; }
    .card .value { font-size: 1.5rem; font-weight: 700; margin-top: 0.25rem; }
    .card .unit { font-size: 0.85rem; color: var(--muted); font-weight: 400; }
    .card.highlight { border-color: var(--accent); background: linear-gradient(180deg, #1a2a42 0%, var(--surface) 100%); }
    .card.highlight .value { color: #93c5fd; }
    section { margin-bottom: 2.5rem; }
    section h2 {
      font-size: 1.1rem; margin-bottom: 1rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border); color: #cbd5e1;
    }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.25rem; }
    .chart-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.25rem;
    }
    .chart-box h3 { font-size: 0.9rem; color: var(--muted); margin-bottom: 1rem; font-weight: 500; }
    .chart-wrap { position: relative; height: 260px; }
    table {
      width: 100%; border-collapse: collapse; font-size: 0.9rem;
      background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
    }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--surface2); color: var(--muted); font-size: 0.8rem; }
    tr:last-child td { border-bottom: none; }
    .insights { display: grid; gap: 0.75rem; }
    .insight {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem 1.2rem;
    }
    .insight h4 { font-size: 0.95rem; color: #93c5fd; margin-bottom: 0.4rem; }
    .insight p { font-size: 0.88rem; color: var(--muted); }
    .activity-bar { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
    .activity-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 4px; }
    .bus-list { font-size: 0.88rem; color: var(--muted); display: grid; gap: 0.4rem; }
    .bus-list code { color: #94a3b8; font-size: 0.82rem; }
    footer { margin-top: 3rem; font-size: 0.8rem; color: var(--muted); text-align: center; }
    ul.discuss { color: var(--muted); font-size: 0.9rem; padding-left: 1.25rem; display: grid; gap: 0.5rem; }
    @media (max-width: 600px) { body { padding: 1rem; } .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>

  <div class="wrap" id="app"></div>
  <script>
    const D = JSON.parse(document.getElementById("report-data").textContent);
    const s = D.summary;
    const esc = (x) => String(x ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

    document.getElementById("app").innerHTML = `
      <header>
        <h1>${esc(D.meta.repoName)} · 仓库级协作模式报告</h1>
        <p class="subtitle">who-is-actor · ${esc(D.meta.generatedAt)} · ${esc(D.meta.scopeLabel)}</p>
        ${(D.meta.badges || []).map(b => `<span class="badge">${esc(b)}</span>`).join("")}
      </header>
      <div class="disclaimer">
        <strong>免责声明：</strong>本报告描述<strong>仓库级</strong>协作模式，不代表个人能力或绩效，<strong>严禁</strong>用于人事决策。
        Git 无法反映设计、评审、文档、值班等不产生 commit 的工作。无按贡献者排名或评分。
      </div>
      <div class="grid" id="kpi-grid"></div>
      <section>
        <h2>概览表</h2>
        <table>
          <thead><tr>
            <th>仓库</th><th>总提交</th><th>行数 +/−</th><th>日历日均</th>
            <th>活跃日%</th><th>周末%</th><th>深夜%</th><th>Bug修复%</th><th>流失率</th><th>可见活动</th>
          </tr></thead>
          <tbody><tr>
            <td><strong>${esc(s.repoName)}</strong></td>
            <td>${esc(s.totalCommits)}</td>
            <td>${esc(s.linesDisplay)}</td>
            <td>${esc(s.commitsPerDay)}</td>
            <td>${esc(s.activeDayPct)}</td>
            <td>${esc(s.weekendPct)}</td>
            <td>${esc(s.lateNightPct)}</td>
            <td>${esc(s.bugFixPct)}</td>
            <td>${esc(s.churnPct)}</td>
            <td>${esc(s.activityBand)}</td>
          </tr></tbody>
        </table>
        <p style="margin-top:0.75rem;font-size:0.85rem;color:var(--muted)">${esc(s.activityNote)}</p>
        <div class="activity-bar"><span style="width:${Math.min(100, Math.max(0, s.activityScorePct || 0))}%"></span></div>
      </section>
      <section><h2>图表</h2><div class="charts">
        <div class="chart-box"><h3>提交时段分布（小时）</h3><div class="chart-wrap"><canvas id="chartHours"></canvas></div></div>
        <div class="chart-box"><h3>星期分布</h3><div class="chart-wrap"><canvas id="chartWeekday"></canvas></div></div>
        <div class="chart-box"><h3>文件扩展名热度</h3><div class="chart-wrap"><canvas id="chartExt"></canvas></div></div>
        <div class="chart-box"><h3>关键比率（仓库级）</h3><div class="chart-wrap"><canvas id="chartRates"></canvas></div></div>
      </div></section>
      <section><h2>六维度观察摘要</h2><div class="insights" id="insights"></div></section>
      ${D.busFactor && D.busFactor.items && D.busFactor.items.length ? `
      <section><h2>文件级巴士因子（仅事实披露）</h2>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:0.75rem">

    const gridColor = "rgba(139,156,179,0.15)";
    const textColor = "#8b9cb3";
    Chart.defaults.color = textColor;
    Chart.defaults.borderColor = gridColor;
    const base = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } };
    const c = D.charts;

    new Chart(document.getElementById("chartHours"), {
      type: "bar",
      data: { labels: c.hours.labels, datasets: [{ label: "提交数", data: c.hours.data, backgroundColor: "rgba(59,130,246,0.7)", borderRadius: 4 }] },

    new Chart(document.getElementById("chartWeekday"), {

    new Chart(document.getElementById("chartExt"), {

    });
    new Chart(document.getElementById("chartRates"), {
      type: "radar",
      data: {
        labels: c.rates.labels,
        datasets: [{ label: "仓库级信号", data: c.rates.data, backgroundColor: "rgba(59,130,246,0.2)", borderColor: "#3b82f6", pointBackgroundColor: "#3b82f6" }],
      },
      options: { ...base, scales: { r: { beginAtZero: true, max: 100, grid: { color: gridColor } } }, plugins: { legend: { display: true, position: "bottom" } } },
    });
  </script>
